<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palinopsia</title>
    <!--
      opsia-asset: serves the bundled MediaPipe wasm + models (embodied control).
      script-src allows the wasm loader glue from that scheme and wasm-unsafe-eval
      for WebAssembly compilation ; connect-src allows fetching the .wasm / .task ;
      worker-src covers any blob worker the Emscripten runtime spins up.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' opsia-asset:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' file: blob: opsia-media:; font-src 'self' data:; connect-src 'self' opsia-asset: blob: data:; worker-src 'self' blob:;"
    />
  </head>
  <body class="bg-bg text-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
