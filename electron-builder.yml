appId: com.vincentfillion.palinopsia
productName: Palinopsia
copyright: Copyright © 2026 Vincent Fillion
directories:
  output: release/${version}
  buildResources: build
# The engine is pure WebGL2 + ISF in the renderer and OSC is pure-JS. The one
# native addon is the Spout (DX11) sender (native/spout, vendored leadedge SDK);
# its prebuilt .node is bundled and asarUnpack'd (a .node can't be loaded from
# inside the asar). Rebuild it per Electron ABI: see native/spout/README.md.
npmRebuild: false
buildDependenciesFromSource: false
files:
  - out/**/*
  - package.json
  - native/spout/build/Release/spout.node
  - "!**/*.map"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
asar: true
asarUnpack:
  - native/spout/build/Release/*.node
  # ffmpeg-static ships a platform binary that must be spawned from disk (not
  # loaded from inside the asar) — unpack it so recording transcodes work.
  - node_modules/ffmpeg-static/**
win:
  # Explicit .ico so the app icon is embedded in the exe. Without it, only a PNG
  # was present and electron-builder shipped the default Electron icon on Windows.
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - target: dmg
  # No arch pin: electron-builder defaults to the build host's arch. CI builds
  # mac twice — macos-latest (Apple Silicon → arm64) and macos-13 (Intel → x64) —
  # so ffmpeg-static bundles the matching native binary in each dmg (a single
  # "universal" dmg on the arm64 runner would ship an arm64-only ffmpeg that
  # fails probe/convert/record on Intel Macs).
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.music
linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  # deb requires a maintainer contact (also present in package.json "author").
  maintainer: Vincent Fillion <vfillion.av@gmail.com>
