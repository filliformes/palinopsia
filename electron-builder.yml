appId: com.vincentfillion.palinopsia
productName: Palinopsia
copyright: Copyright © 2026 Vincent Fillion
directories:
  output: release/${version}
  buildResources: build
# The engine is pure WebGL2 + ISF in the renderer and OSC is pure-JS. The native
# addons are the texture-share senders : Spout (DX11, native/spout, vendored
# leadedge SDK) on Windows and Syphon (Metal, native/syphon, + its framework) on
# macOS. Their prebuilt .node files are bundled and asarUnpack'd (a .node can't be
# loaded from inside the asar). Rebuild per Electron ABI : see their READMEs.
npmRebuild: false
buildDependenciesFromSource: false
files:
  - out/**/*
  - package.json
  - native/spout/build/Release/spout.node
  - native/syphon/build/Release/syphon.node
  - native/syphon/build/Release/Syphon.framework/**/*
  - "!**/*.map"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
asar: true
asarUnpack:
  - native/spout/build/Release/*.node
  - native/syphon/build/Release/**
  # ffmpeg-static ships a platform binary that must be spawned from disk (not
  # loaded from inside the asar) — unpack it so recording transcodes work.
  - node_modules/ffmpeg-static/**
  # koffi (the FFI the NDI sender calls the NDI runtime through) : its per-OS
  # .node lives in an @koromix/koffi-<os>-<arch> package.
  - node_modules/koffi/**
  - node_modules/@koromix/**
# Ship the icon into resources/ so the RUNNING window can set BrowserWindow.icon
# (windowIcon() in main). The exe icon alone only covers the taskbar shortcut,
# not a running app's taskbar button.
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  # MediaPipe embodied-control assets (Hands + Pose). Self-hosted so tracking
  # works OFFLINE and in a kiosk install : the renderer loads them over the
  # opsia-asset:// scheme (main/assets.ts), never Google's CDN. wasm is the SIMD
  # build only (Electron 44 / Chromium always has wasm SIMD).
  - from: resources/mediapipe
    to: mediapipe
  # The NDI runtime, when one was put in resources/ndi/<os> before building
  # (see resources/ndi/README.md). The NDI licence allows shipping it in the
  # application's own folder; without it the app uses the machine's NDI.
  - from: resources/ndi/${os}
    to: ndi
    filter:
      - "**/*"
      - "!.gitkeep"
win:
  # Explicit .ico so the app icon is embedded in the exe. Without it, only a PNG
  # was present and electron-builder shipped the default Electron icon on Windows.
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  # Apple Silicon only, built on CI's macos-latest (arm64) runner, so ffmpeg-static
  # bundles that runner's arm64 binary. No Intel build (its runners only ever
  # blocked a release); Intel Macs build from source.
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.music
  # An ad-hoc signature ("-") : Apple Silicon refuses to run unsigned code, and
  # electron-builder 26 no longer falls back to one by itself (26.15 skipped
  # signing entirely : "Palinopsia is damaged"). Not notarized : see the README.
  identity: "-"
  # The hardened runtime only pays off with notarization, and without the camera
  # and audio-input entitlements it would silently block the camera and the mic.
  hardenedRuntime: false
  # What macOS shows when it asks for each permission. Local network : OSC,
  # OSCQuery, NDI, Art-Net / WLED and HIVE (macOS 15 blocks it silently otherwise).
  extendInfo:
    NSCameraUsageDescription: Palinopsia uses a camera as a live video source and for body tracking, only when you choose one.
    NSMicrophoneUsageDescription: Palinopsia listens to an audio input to drive the picture and the sound, only when you choose one.
    NSAudioCaptureUsageDescription: Palinopsia can capture the screen as a video source when you choose it.
    NSLocalNetworkUsageDescription: Palinopsia sends and receives OSC, NDI video, Art-Net and WLED light data and HIVE streams on your local network.
    NSDocumentsFolderUsageDescription: Palinopsia keeps its sessions and recordings in Documents/Palinopsia.
    NSBonjourServices:
      - _ndi._tcp
      - _oscjson._tcp
      - _osc._udp
    # No App Nap : macOS slows an app it judges idle (a covered window, no input),
    # and an installation that renders behind its own fullscreen output is exactly that.
    NSAppSleepDisabled: true
linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  # deb requires a maintainer contact (also present in package.json "author").
  maintainer: Vincent Fillion <vfillion.av@gmail.com>
