name: build

# Builds Windows (NSIS + portable), macOS (DMG, per-arch), and Linux (AppImage +
# deb) artifacts on a tag push, then drafts a GitHub Release with all of them.
#
# macOS is built on macos-latest (Apple Silicon, arm64) only. The texture-share
# addons are native modules whose prebuilt .node files are git-ignored, so they
# are rebuilt against the packaged Electron ABI before electron-builder runs :
# Spout (native/spout, DX11) on Windows, Syphon (native/syphon, Metal, plus the
# Syphon framework built from source) on macOS. Linux has neither.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to windows-2022 (VS 2022 / v17). `windows-latest` has rolled to
          # the windows-2025 image, which ships Visual Studio 18 — a version the
          # node-gyp (9.x) that rebuilds the Spout addon can't map to a toolchain,
          # so it fails VS detection ("unknown version"). VS 2022 is recognized.
          # Revisit once node-gyp detects VS 18 and windows-2022 nears retirement.
          - os: windows-2022
            platform: win
            script: build:win
          - os: macos-latest
            platform: mac
            script: build:mac
          # No Intel-mac (macos-13) build: those runners are scarce and slow to
          # allocate and only ever blocked the release. Palinopsia ships macOS
          # Apple-Silicon (arm64) only; Intel-mac users build from source.
          - os: ubuntu-latest
            platform: linux
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Spout addon (Windows only)
        if: matrix.platform == 'win'
        shell: bash
        working-directory: native/spout
        run: |
          npm install --ignore-scripts
          # node-gyp@11 (not the transitive 9.x): its bundled gyp-next runs on
          # Python 3.12, whereas node-gyp 9's gyp does `from distutils.version
          # import StrictVersion` and 3.12 removed distutils (PEP 632), which
          # crashed `gyp configure` on the runner even once VS was found.
          npx --yes node-gyp@11 rebuild \
            --target=$(node -p "require('electron/package.json').version") \
            --dist-url=https://electronjs.org/headers \
            --arch=x64
      - name: Build Syphon addon (macOS only)
        if: matrix.platform == 'mac'
        # A Syphon build problem must never block a release : the app then just
        # reports Syphon unavailable (see native/syphon/README.md).
        continue-on-error: true
        shell: bash
        run: sh native/syphon/build.sh
      - run: npm run typecheck
      - run: npm run ${{ matrix.script }}
      # The mac app must carry an ad-hoc signature, its ffmpeg included : an
      # unsigned app does not launch on Apple Silicon ("damaged").
      - name: Verify the mac app's signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          APP=$(ls -d release/*/mac-arm64/Palinopsia.app)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier|Format"
          codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc"
          FF="$APP/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg"
          file "$FF"
          codesign --verify --strict "$FF"
      - uses: actions/upload-artifact@v4
        with:
          name: palinopsia-${{ matrix.os }}
          # The named packages only : release/**/*.exe also caught the unpacked
          # app (win-unpacked : Palinopsia.exe, elevate.exe, ffmpeg.exe), which
          # landed on the v1.2.0 draft as three stray downloads.
          path: |
            release/**/Palinopsia-*.exe
            release/**/Palinopsia-*.dmg
            release/**/Palinopsia-*.AppImage
            release/**/Palinopsia-*.deb
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Drafts (does not auto-publish) a release with every platform artifact.
      # Builds are unsigned / un-notarized — the release notes tell users to
      # right-click → Open (or `xattr -cr`) past Gatekeeper, More info → Run anyway
      # past SmartScreen.
      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          draft: true
          generate_release_notes: true
