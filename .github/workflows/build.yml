name: build

# Builds Windows (NSIS + portable), macOS (DMG, per-arch), and Linux (AppImage +
# deb) artifacts on a tag push, then drafts a GitHub Release with all of them.
#
# macOS is built twice — macos-latest (Apple Silicon → arm64) and macos-13 (Intel
# → x64) — so ffmpeg-static bundles the matching native binary in each dmg. The
# Windows Spout addon (native/spout) is a DX11 native module whose prebuilt .node
# is git-ignored, so it is rebuilt against the packaged Electron ABI before
# electron-builder runs; mac/linux skip it (Spout is Windows-only and guarded).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to windows-2022 (VS 2022 / v17). `windows-latest` has rolled to
          # the windows-2025 image, which ships Visual Studio 18 — a version the
          # node-gyp (9.x) that rebuilds the Spout addon can't map to a toolchain,
          # so it fails VS detection ("unknown version"). VS 2022 is recognized.
          # Revisit once node-gyp detects VS 18 and windows-2022 nears retirement.
          - os: windows-2022
            platform: win
            script: build:win
          - os: macos-latest
            platform: mac
            script: build:mac
          - os: macos-13
            platform: mac
            script: build:mac
          - os: ubuntu-latest
            platform: linux
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Spout addon (Windows only)
        if: matrix.platform == 'win'
        shell: bash
        working-directory: native/spout
        run: |
          npm install --ignore-scripts
          npx --yes node-gyp rebuild \
            --target=$(node -p "require('electron/package.json').version") \
            --dist-url=https://electronjs.org/headers \
            --arch=x64
      - run: npm run typecheck
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: palinopsia-${{ matrix.os }}
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.deb
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Drafts (does not auto-publish) a release with every platform artifact.
      # macOS dmgs are unsigned/un-notarized for v0.1.0 — the release notes should
      # tell users to right-click → Open (or `xattr -cr`) past Gatekeeper.
      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          draft: true
          generate_release_notes: true
